name: Kerala PSC Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pyTelegramBotAPI PyMuPDF urllib3

      - name: 1. Send Direct Test Message & Verify Secrets
        env:
          TOKEN_1: ${{ secrets.BOT_TOKEN }}
          TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOKEN_3: ${{ secrets.TOKEN }}
        run: |
          python - << 'EOF'
          import os, sys, requests

          # Automatically pick whichever secret name you saved in GitHub Settings
          token = (os.environ.get("TOKEN_1") or os.environ.get("TOKEN_2") or os.environ.get("TOKEN_3") or "").strip()
          chat_id = "@topkeralapsc"

          if not token:
              print("❌ ERROR: No Bot Token found in GitHub Secrets!")
              print("Go to Repo Settings -> Secrets and variables -> Actions -> New repository secret -> Name it BOT_TOKEN")
              sys.exit(1)

          print(f"[*] Found Token (starts with {token[:6]}...). Testing getMe...")
          me = requests.get(f"https://api.telegram.org/bot{token}/getMe").json()
          if not me.get("ok"):
              print(f"❌ INVALID TOKEN: {me}")
              sys.exit(1)

          bot_username = me["result"]["username"]
          print(f"✅ Authenticated as @{bot_username}")

          # Send test message to @topkeralapsc
          res = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id": chat_id,
                  "text": f"✅ <b>Connected!</b> @{bot_username} is now active on @topkeralapsc. Fetching watermarked Kerala PSC PDFs...",
                  "parse_mode": "HTML"
              }
          ).json()

          if not res.get("ok"):
              print(f"❌ TELEGRAM REJECTED POST TO {chat_id}: {res}")
              print(f"👉 Fix: Open @topkeralapsc on Telegram -> Administrators -> Add @{bot_username} as Admin with 'Post Messages' enabled!")
              sys.exit(1)

          print("🎉 SUCCESS! Test message delivered to @topkeralapsc!")
          EOF

      - name: 2. Run Main Bot Script (bot.py)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TOKEN }}
          CHAT_ID: "@topkeralapsc"
        run: |
          python -u bot.py

      - name: 3. Save Posted Links
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_links.txt posted_data.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted links" && git push)
