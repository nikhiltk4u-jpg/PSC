name: Kerala PSC Bot Runner

on:
  workflow_dispatch: # Allows manual run button
  schedule:
    - cron: '0 */2 * * *' # Runs every 2 hours

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyTelegramBotAPI PyMuPDF urllib3

      # --- DIRECT TELEGRAM PERMISSION CHECK ---
      - name: Test Telegram Bot & Channel Permissions
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c "
          import os, sys, requests

          token = os.environ.get('BOT_TOKEN', '').strip()
          chat_id = os.environ.get('CHAT_ID', '@topkeralapsc').strip()
          if not chat_id.startswith('@') and not chat_id.startswith('-'):
              chat_id = '@' + chat_id

          print(f'[*] Testing Telegram connection to channel: {chat_id}')
          if not token:
              print('::error::BOT_TOKEN secret is empty or missing!')
              sys.exit(1)

          # 1. Check getMe
          r = requests.get(f'https://api.telegram.org/bot{token}/getMe').json()
          if not r.get('ok'):
              print(f'::error::Invalid BOT_TOKEN: {r}')
              sys.exit(1)
          print(f'✅ Bot authenticated: @{r[\"result\"][\"username\"]}')

          # 2. Send Live Test Message
          msg = '🚀 <b>GitHub Actions Test:</b> Bot permissions verified for @topkeralapsc!'
          send_url = f'https://api.telegram.org/bot{token}/sendMessage'
          res = requests.post(send_url, data={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}).json()

          if not res.get('ok'):
              print(f'::error::Failed to post to {chat_id}: {res}')
              sys.exit(1)

          print(f'🎉 Test message posted successfully to {chat_id}!')
          "

      # --- RUN MAIN SCRAPER & PDF WATERMARKER ---
      - name: Run Kerala PSC Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      # --- SAVE POSTED LINKS BACK TO GITHUB ---
      - name: Commit and push tracking file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_links.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted_links.txt [skip ci]" && git push)
